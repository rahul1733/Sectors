<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Group Invite Sender</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f4f4f4;
    font-family:Arial,sans-serif;
}

.container{
    max-width:650px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#5f259f;
}

.info{
    background:#f3e8ff;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
    color:#5f259f;
    font-size:14px;
}

textarea{
    width:100%;
    height:180px;
    padding:12px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:15px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#5f259f;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#5f259f;
    color:white;
}

.success{
    color:green;
    font-weight:bold;
}

.pending{
    color:orange;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>WhatsApp Group Invite Tool</h1>

<div class="info">
Paste mobile numbers only.<br><br>

Example:<br>
919876543210<br>
919812345678<br>
919999999999
</div>

<textarea id="numbers" placeholder="Paste mobile numbers here..."></textarea>

<button onclick="loadNumbers()">Load Numbers</button>

<button onclick="startSending()">Start Sending Invite</button>

<table id="table">

<thead>
<tr>
<th>Mobile Number</th>
<th>Status</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

<script>

const groupLink = "https://chat.whatsapp.com/EiYVtMTTkTq8dFTdJMnfIx";

let contacts = [];

function loadNumbers(){

    const input = document.getElementById("numbers").value.trim();

    if(!input){
        alert("Paste mobile numbers first");
        return;
    }

    contacts = input.split("\n");

    const tbody = document.querySelector("#table tbody");

    tbody.innerHTML = "";

    contacts.forEach(num => {

        const cleanNum = num.trim();

        if(cleanNum){

            tbody.innerHTML += `
            <tr>
                <td>${cleanNum}</td>
                <td class="pending">Pending</td>
            </tr>
            `;
        }

    });

    alert(contacts.length + " numbers loaded");

}

async function startSending(){

    const rows = document.querySelectorAll("#table tbody tr");

    for(let i=0;i<contacts.length;i++){

        const num = contacts[i].trim();

        const message =
`Hello,

Join WhatsApp Group:
${groupLink}`;

        const encoded = encodeURIComponent(message);

        const url = `https://wa.me/${num}?text=${encoded}`;

        window.open(url,"_blank");

        rows[i].cells[1].innerHTML =
        `<span class="success">Opened</span>`;

        await sleep(5000);

    }

    alert("All invites opened");

}

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
}

</script>

</body>
</html>
